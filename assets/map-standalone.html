  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"452bb4e1-befa-47b6-a58e-6ba51d1bdcb2\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'DM Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a5ec7976-5b6c-445b-acd6-69e5860b0f2e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* =========================================================\n     COLORS — Pastel Mediterranean palette\n     ========================================================= */\n\n  /* Yellows — sunny, pastel, lemon */\n  --color-lemon-50:  #FFFBEC;  /* near-cream wash, default page bg */\n  --color-lemon-100: #FFF4C9;  /* pale pastel yellow — stripes light */\n  --color-lemon-200: #FCE789;  /* soft butter yellow — stripes mid */\n  --color-lemon-300: #F8D34A;  /* sunny lemon — accent buttons */\n  --color-lemon-400: #F2B81E;  /* deep ripe lemon — illustration fill */\n  --color-lemon-500: #D89A05;  /* amber accent for hover */\n\n  /* Blues — sky, cobalt, ink */\n  --color-sky-50:    #F1F6FC;  /* faintest sky wash */\n  --color-sky-100:   #DCE9F8;  /* pastel sky for stripes / cards */\n  --color-sky-200:   #B8D2F1;  /* mid sky for chips, hover */\n  --color-sky-300:   #87B0E0;  /* clear-day sky */\n  --color-sky-400:   #5187CC;  /* mid cobalt */\n  --color-cobalt:    #1E47B5;  /* primary brand blue — links, buttons, ink */\n  --color-ink:       #0E2A6B;  /* deepest ink blue — display headings */\n\n  /* Neutrals — warm whites, off-white linen, soft sage tints */\n  --color-cream:     #FFFBF2;  /* soft cream paper */\n  --color-paper:     #F8F2E2;  /* warmer paper, used for cards */\n  --color-linen:     #EFE8D4;  /* linen surface */\n  --color-sage-100:  #DFE5D3;  /* greenery muted */\n  --color-sage-300:  #88A176;  /* lemon-leaf green for illustrations */\n  --color-charcoal:  #2A2620;  /* warm body text */\n  --color-muted:     #6F695A;  /* secondary text */\n\n  /* Semantic ------------------------------------------------ */\n  --bg-page:        var(--color-cream);\n  --bg-surface:     #FFFFFFEE;\n  --bg-card:        var(--color-paper);\n  --bg-inset:       var(--color-lemon-50);\n\n  --fg-default:     var(--color-charcoal);\n  --fg-muted:       var(--color-muted);\n  --fg-display:     var(--color-ink);          /* names, display headings */\n  --fg-script:      var(--color-cobalt);       /* brush-script highlights */\n  --fg-on-blue:     var(--color-lemon-50);\n  --fg-on-yellow:   var(--color-cobalt);\n\n  --accent-primary:   var(--color-cobalt);\n  --accent-secondary: var(--color-lemon-300);\n  --accent-soft:      var(--color-sky-100);\n\n  --border-soft:   #E7DEC6;\n  --border-mid:    #C9BE9E;\n  --border-strong: var(--color-cobalt);\n\n  --link:          var(--color-cobalt);\n  --link-hover:    var(--color-ink);\n\n  /* =========================================================\n     TYPOGRAPHY — three voices: script, serif, sans\n     ========================================================= */\n  --font-script:   'Allura', 'Snell Roundhand', 'Apple Chancery', cursive;\n  --font-serif:    'Cormorant Garamond', 'Garamond', 'Iowan Old Style', serif;\n  --font-sans:     'DM Sans', -apple-system, 'Helvetica Neue', sans-serif;\n\n  /* Type scale (1.25 ratio, gently exaggerated at the top) */\n  --fs-50:  12px;\n  --fs-75:  14px;\n  --fs-100: 16px;   /* body */\n  --fs-200: 18px;\n  --fs-300: 22px;\n  --fs-400: 28px;\n  --fs-500: 36px;\n  --fs-600: 48px;\n  --fs-700: 64px;\n  --fs-800: 88px;\n  --fs-900: 120px;  /* hero script */\n\n  --lh-tight:   1.08;\n  --lh-snug:    1.2;\n  --lh-normal:  1.45;\n  --lh-relaxed: 1.65;\n\n  --tracking-wide:    0.18em;   /* eyebrow caps */\n  --tracking-display: 0.04em;   /* big serif names */\n  --tracking-normal:  0;\n\n  /* =========================================================\n     SPACING — 4 px base\n     ========================================================= */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  24px;\n  --space-6:  32px;\n  --space-7:  48px;\n  --space-8:  64px;\n  --space-9:  96px;\n  --space-10: 128px;\n\n  /* =========================================================\n     RADII — gently rounded; arches at the top\n     ========================================================= */\n  --radius-xs:    4px;\n  --radius-sm:    8px;\n  --radius-md:    14px;\n  --radius-lg:    22px;\n  --radius-pill:  999px;\n  --radius-arch:  50% 50% 8px 8px / 60% 60% 8px 8px;  /* invitation arch */\n\n  /* =========================================================\n     SHADOWS — soft, paper-on-linen\n     ========================================================= */\n  --shadow-xs: 0 1px 2px rgba(14, 42, 107, 0.06);\n  --shadow-sm: 0 2px 8px rgba(14, 42, 107, 0.08);\n  --shadow-md: 0 10px 24px -8px rgba(14, 42, 107, 0.18), 0 2px 6px rgba(14, 42, 107, 0.08);\n  --shadow-lg: 0 24px 48px -20px rgba(14, 42, 107, 0.28), 0 4px 14px rgba(14, 42, 107, 0.10);\n\n  /* =========================================================\n     MOTION\n     ========================================================= */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-soft:  cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:   140ms;\n  --dur-base:   240ms;\n  --dur-slow:   420ms;\n\n  /* =========================================================\n     SIGNATURE PATTERN — yellow stripes\n     The visual DNA of this brand.\n     ========================================================= */\n  --pattern-stripes-yellow:\n    repeating-linear-gradient(\n      90deg,\n      var(--color-lemon-100) 0 22px,\n      var(--color-cream)     22px 44px\n    );\n  --pattern-stripes-yellow-fine:\n    repeating-linear-gradient(\n      90deg,\n      var(--color-lemon-200) 0 10px,\n      var(--color-cream)     10px 22px\n    );\n  --pattern-stripes-blue:\n    repeating-linear-gradient(\n      90deg,\n      var(--color-sky-100) 0 22px,\n      #FFFFFF              22px 44px\n    );\n}\n\n/* =========================================================\n   SEMANTIC TYPE — apply on bare HTML\n   ========================================================= */\nhtml {\n  font-size: 16px;\n  color: var(--fg-default);\n  background: var(--bg-page);\n}\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-100);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-default);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Display / hero — brush script (rare, BIG, used for hero moments) */\n.t-hero-script {\n  font-family: var(--font-script);\n  font-weight: 400;\n  font-size: clamp(72px, 12vw, var(--fs-900));\n  line-height: 0.95;\n  color: var(--accent-primary);\n  letter-spacing: 0;\n}\n\n/* Names / monumental — wide-letterspaced classic serif */\nh1, .t-display {\n  font-family: var(--font-serif);\n  font-weight: 500;\n  font-size: var(--fs-700);\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-display);\n  color: var(--fg-display);\n  margin: 0;\n}\n\nh2, .t-h2 {\n  font-family: var(--font-serif);\n  font-weight: 500;\n  font-size: var(--fs-500);\n  line-height: var(--lh-snug);\n  color: var(--fg-display);\n  margin: 0;\n}\n\nh3, .t-h3 {\n  font-family: var(--font-serif);\n  font-weight: 500;\n  font-size: var(--fs-400);\n  line-height: var(--lh-snug);\n  color: var(--fg-display);\n  margin: 0;\n}\n\n/* Eyebrow caps — small all-caps sans, wide tracked. Used a lot. */\n.t-eyebrow {\n  font-family: var(--font-sans);\n  font-weight: 500;\n  font-size: var(--fs-75);\n  text-transform: uppercase;\n  letter-spacing: var(--tracking-wide);\n  color: var(--accent-primary);\n}\n\n/* Script accent — small or mid-sized cursive (\"the\", \"and\", \"Save\") */\n.t-script {\n  font-family: var(--font-script);\n  font-weight: 400;\n  color: var(--accent-primary);\n  font-size: var(--fs-500);\n  line-height: 1;\n}\n\np, .t-body {\n  font-family: var(--font-sans);\n  font-size: var(--fs-100);\n  line-height: var(--lh-relaxed);\n  color: var(--fg-default);\n  margin: 0 0 var(--space-4);\n  text-wrap: pretty;\n}\n\n.t-lead {\n  font-family: var(--font-serif);\n  font-style: italic;\n  font-weight: 400;\n  font-size: var(--fs-300);\n  line-height: var(--lh-normal);\n  color: var(--fg-muted);\n}\n\n.t-caption {\n  font-family: var(--font-sans);\n  font-size: var(--fs-75);\n  color: var(--fg-muted);\n}\n\na {\n  color: var(--link);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover { color: var(--link-hover); }\n\n/* =========================================================\n   UTILITIES — small, used everywhere\n   ========================================================= */\n.bg-stripes-yellow { background: var(--pattern-stripes-yellow); }\n.bg-stripes-blue   { background: var(--pattern-stripes-blue); }\n.bg-paper          { background: var(--bg-card); }\n.bg-cream          { background: var(--bg-page); }\n.bg-cobalt         { background: var(--color-cobalt); color: var(--fg-on-blue); }\n<\u002Fstyle>\n\n  <!-- Splash / no-JS fallback for the standalone bundle -->\n  \n  <style>\n    html, body { margin: 0; }\n    body {\n      background: var(--bg-page);\n      font-family: var(--font-sans);\n      color: var(--fg-default);\n      padding: var(--space-7) var(--space-5);\n      box-sizing: border-box;\n    }\n    .map-section { max-width: 1180px; width: 100%; margin: 0 auto; text-align: center; }\n    .map-eyebrow {\n      font: 500 12px/1 var(--font-sans);\n      text-transform: uppercase; letter-spacing: 0.22em; color: var(--color-cobalt);\n    }\n    .map-title {\n      font-family: var(--font-serif); font-weight: 500;\n      font-size: clamp(34px, 5vw, 52px); line-height: 1.05;\n      color: var(--fg-display); letter-spacing: 0.02em; margin: 6px 0 4px;\n    }\n    .map-title em { font-style: italic; font-weight: 400; }\n    .map-title .script {\n      font-family: var(--font-script); font-weight: 400; color: var(--color-cobalt);\n      font-size: 1.05em; letter-spacing: 0; vertical-align: -0.1em; margin-right: 4px; line-height: 0;\n    }\n    .map-subtitle {\n      font: italic 17px/1.5 var(--font-serif); color: var(--color-muted);\n      margin: 8px auto 26px; max-width: 46ch;\n    }\n    .map-frame {\n      position: relative; width: 100%; aspect-ratio: 1500 / 689;\n      background: radial-gradient(ellipse 75% 80% at center, var(--color-cream) 0%, var(--color-paper) 80%);\n      border: 1px solid var(--border-soft); border-radius: 22px;\n      overflow: hidden; box-shadow: var(--shadow-md);\n    }\n    .map-frame svg { width: 100%; height: 100%; display: block; }\n\n    /* Flight paths */\n    .travel-path {\n      fill: none; stroke: var(--color-cobalt); stroke-width: 1.6;\n      stroke-linecap: round; stroke-dasharray: 7 9; opacity: 0.55;\n      animation: dashPulse 13s linear infinite;\n    }\n    @keyframes dashPulse { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -320; } }\n\n    /* Origin markers */\n    .origin-core { fill: var(--color-cobalt); }\n    .origin-dot  { fill: var(--color-lemon-300); }\n    .origin-ring {\n      fill: none; stroke: var(--color-cobalt); stroke-width: 1.4; opacity: 0.4;\n      animation: ringPulse 2.8s var(--ease-out) infinite;\n    }\n    @keyframes ringPulse {\n      0% { r: 5; opacity: 0.45; } 80% { r: 17; opacity: 0; } 100% { r: 17; opacity: 0; }\n    }\n\n    .lemo
