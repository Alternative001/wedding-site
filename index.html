<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lisa &amp; Julian · private Einladung</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-monogram.svg" />
  <link rel="stylesheet" href="colors_and_type.css" />

  <!-- Resources referenced as STRINGS — lifted for standalone bundling -->
  <meta name="ext-resource-dependency" content="assets/lemon.png" data-resource-id="lemonHero" />

  <!-- Standalone splash / no-JS fallback -->
  <template id="__bundler_thumbnail" data-bg-color="#FFFBF2">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="stripe" patternUnits="userSpaceOnUse" width="44" height="44">
          <rect width="22" height="44" fill="#FFF4C9" />
          <rect x="22" width="22" height="44" fill="#FFFBF2" />
        </pattern>
      </defs>
      <rect width="1200" height="800" fill="#FFFBF2" />
      <rect x="350" y="120" width="500" height="500" rx="250" fill="url(#stripe)" stroke="#1E47B5" stroke-width="6" />
      <!-- simple stylized lemon -->
      <ellipse cx="600" cy="370" rx="120" ry="100" fill="none" stroke="#1E47B5" stroke-width="14" />
      <path d="M540 290 Q540 230 600 240 Q660 230 660 290" fill="none" stroke="#1E47B5" stroke-width="12" stroke-linecap="round" />
      <text x="600" y="720" text-anchor="middle" font-family="serif" font-size="64" letter-spacing="14" fill="#0E2A6B" font-weight="500">LISA &amp; JULIAN</text>
    </svg>
  </template>

  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg-page);
      font-family: var(--font-sans);
      color: var(--fg-default);
      display: grid;
      place-items: center;
      padding: var(--space-5);
      box-sizing: border-box;
      overflow-x: hidden;
    }

    /* Soft yellow-stripe wash behind everything, gently masked */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: var(--pattern-stripes-yellow);
      opacity: 0.45;
      z-index: 0;
      -webkit-mask-image: radial-gradient(ellipse 70% 70% at center, black 25%, transparent 75%);
              mask-image: radial-gradient(ellipse 70% 70% at center, black 25%, transparent 75%);
      pointer-events: none;
    }

    .gate {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
      animation: rise 700ms var(--ease-out) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Tiny top mark — guests immediately know they are on the right page */
    .gate-mark {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font: 500 13px/1 var(--font-sans);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--color-cobalt);
      background: rgba(255, 251, 242, 0.8);
      border: 1px solid var(--border-soft);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: var(--shadow-xs);
    }
    .gate-mark .amp {
      font-family: var(--font-script);
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 0;
      color: var(--color-cobalt);
      text-transform: none;
      line-height: 0;
      vertical-align: -3px;
    }

    /* Lemon hero — transparent illustration, floats free */
    .gate-lemon {
      width: 260px;
      max-width: 60vw;
      animation: lemonSway 8s ease-in-out infinite alternate;
      transform-origin: 50% 90%;
    }
    .gate-lemon img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 18px 24px rgba(14, 42, 107, 0.18));
    }
    @keyframes lemonSway {
      from { transform: rotate(-3deg); }
      to   { transform: rotate(3deg); }
    }

    /* Wordmark */
    .gate-names {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: clamp(40px, 8vw, 56px);
      line-height: 1;
      letter-spacing: 0.16em;
      color: var(--color-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: var(--space-2) 0 0;
    }
    .gate-amp {
      font-family: var(--font-script);
      font-weight: 400;
      color: var(--color-cobalt);
      font-size: 0.95em;
      letter-spacing: 0;
      line-height: 0.7;
      margin: -0.05em 0;
    }
    .gate-meta {
      font: 500 11px/1 var(--font-sans);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--color-cobalt);
      margin-top: -2px;
    }

    .gate-subtitle {
      font: italic 17px/1.5 var(--font-serif);
      color: var(--color-muted);
      max-width: 32ch;
      margin: var(--space-2) 0 var(--space-3);
    }

    /* Password form */
    .gate-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: stretch;
    }
    .gate-input-row {
      display: flex;
      gap: 8px;
      background: #fff;
      border: 1.5px solid var(--border-mid);
      border-radius: 14px;
      padding: 6px 6px 6px 18px;
      transition: border-color 160ms, box-shadow 160ms;
    }
    .gate-input-row:focus-within {
      border-color: var(--color-cobalt);
      box-shadow: 0 0 0 4px rgba(30, 71, 181, 0.14);
    }
    .gate-input-row.is-wrong {
      animation: shake 360ms cubic-bezier(.36,.07,.19,.97);
      border-color: #C8543A;
      box-shadow: 0 0 0 4px rgba(200, 84, 58, 0.16);
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-2px); }
      20%, 80% { transform: translateX(4px); }
      30%, 50%, 70% { transform: translateX(-6px); }
      40%, 60% { transform: translateX(6px); }
    }
    .gate-input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      font: 400 17px/1 var(--font-sans);
      letter-spacing: 0.04em;
      color: var(--color-charcoal);
      padding: 12px 0;
    }
    .gate-input::placeholder {
      color: var(--color-muted);
      opacity: 0.7;
      font-style: italic;
      font-family: var(--font-serif);
    }
    .gate-submit {
      border: 0;
      background: var(--color-cobalt);
      color: var(--color-cream);
      font: 500 14px/1 var(--font-sans);
      letter-spacing: 0.04em;
      padding: 0 22px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 140ms;
      white-space: nowrap;
    }
    .gate-submit:hover { background: var(--color-ink); }
    .gate-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    .gate-msg {
      font: 14px/1.4 var(--font-sans);
      color: var(--color-muted);
      min-height: 1.4em;
      transition: color 140ms;
    }
    .gate-msg.is-error { color: #8a2f1c; }

    /* Hint disclosure */
    .gate-hint {
      margin-top: var(--space-3);
      font: 13px/1.4 var(--font-sans);
      color: var(--color-muted);
    }
    .gate-hint-btn {
      background: none;
      border: 0;
      color: var(--color-cobalt);
      font: 500 13px var(--font-sans);
      letter-spacing: 0.04em;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .gate-hint-text {
      display: none;
      font: italic 13px/1.5 var(--font-serif);
      color: var(--color-muted);
      margin-top: 6px;
      max-width: 36ch;
      margin-left: auto;
      margin-right: auto;
    }
    .gate-hint-text.is-open { display: block; }

    /* Tiny script flourish at top */
    .gate-private {
      font-family: var(--font-script);
      font-weight: 400;
      color: var(--color-cobalt);
      font-size: 38px;
      line-height: 1;
      margin: var(--space-1) 0;
    }

    /* ---- Lemon burst + confetti ---- */
    .burst-stage {
      position: fixed; inset: 0;
      z-index: 9999;
      pointer-events: none;
      overflow: hidden;
    }
    .burst-lemon-clone {
      position: absolute;
      top: 50%; left: 50%;
      width: 260px;
      max-width: 60vw;
      transform-origin: center;
      animation: burstPop 420ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .burst-lemon-clone img {
      width: 100%; height: auto; display: block;
      filter: drop-shadow(0 18px 24px rgba(14, 42, 107, 0.22));
    }
    @keyframes burstPop {
      0%   { transform: translate(-50%,-50%) scale(1)   rotate(0deg);  opacity: 1; }
      55%  { transform: translate(-50%,-50%) scale(1.9) rotate(-6deg); opacity: 1; }
      80%  { transform: translate(-50%,-50%) scale(2.5) rotate(4deg);  opacity: 0.5; }
      100% { transform: translate(-50%,-50%) scale(2.7) rotate(-2deg); opacity: 0; }
    }

    .burst-flash {
      position: fixed; inset: 0;
      background: #F8D34A;
      z-index: 9998;
      opacity: 0;
      animation: burstFlash 700ms 300ms ease-out forwards;
    }
    @keyframes burstFlash {
      0%   { opacity: 0; }
      10%  { opacity: 0.82; }
      100% { opacity: 0; }
    }

    /* Confetti strips + dots */
    .burst-confetti {
      position: fixed;
      top: 50%; left: 50%;
      animation: confettiFly var(--dur) var(--delay) cubic-bezier(0.12, 0.8, 0.4, 1) forwards;
    }
    @keyframes confettiFly {
      0%   { transform: translate(-50%,-50%) translate(0,0)                        rotate(0deg)        scale(1);   opacity: 1; }
      75%  {                                                                                                        opacity: 1; }
      100% { transform: translate(-50%,-50%) translate(var(--tx),var(--ty)) rotate(var(--spin)) scale(0.5); opacity: 0; }
    }

    /* "La Dolce Vita" script pop */
    .burst-text {
      position: fixed;
      top: 50%; left: 50%;
      z-index: 10001;
      pointer-events: none;
      white-space: nowrap;
      font-family: 'Allura', 'Snell Roundhand', cursive;
      font-size: clamp(52px, 11vw, 96px);
      color: #1E47B5;
      text-shadow: 0 4px 24px rgba(14, 42, 107, 0.18);
      opacity: 0;
      animation:
        ldvPop  600ms 360ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        ldvFade 500ms 1200ms ease-in forwards;
    }
    @keyframes ldvPop {
      0%   { transform: translate(-50%,-50%) scale(0.4) rotate(-4deg); opacity: 0; }
      100% { transform: translate(-50%,-50%) scale(1)   rotate(-2deg); opacity: 1; }
    }
    @keyframes ldvFade {
      0%   { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ---- Curtain entry animation: signature stripe slats part from the centre ---- */
    #jl-curtain {
      position: fixed; inset: 0; z-index: 9000;
      display: flex;
      pointer-events: none;
      overflow: hidden;
      background: #FFFBF2;
    }
    .jl-curtain-slat {
      flex: 1; height: 100%;
      /* same signature yellow stripe as the page background */
      background-image: repeating-linear-gradient(90deg,
        #FFF4C9 0 22px, #FFFBF2 22px 44px);
      will-change: transform;
    }
  </style>
</head>
<body>
  <div id="jl-curtain"></div>
  <script>
    // Reusable striped curtain. open() parts from the centre; close() seals to
    // the centre. The gate opens it on load and closes it again over the lemon
    // burst, so the hand-off to the next page reads as one continuous motion.
    window.jlCurtain = (function () {
      var N = 14, DUR = 600, STAGGER = 55, EASE = 'cubic-bezier(0.7,0,0.3,1)';
      var el = document.getElementById('jl-curtain');
      var center = (N - 1) / 2;
      var slats = [];
      function build() {
        el.innerHTML = '';
        slats = [];
        for (var i = 0; i < N; i++) {
          var s = document.createElement('div');
          s.className = 'jl-curtain-slat';
          el.appendChild(s);
          slats.push(s);
        }
        slats.forEach(function (s, i) {
          // Keep the stripe pattern continuous across all slats (no seams), and
          // anchor each slat to its outer edge so the seam lives at the centre.
          s.style.backgroundPositionX = (-s.offsetLeft) + 'px';
          s.style.transformOrigin = (i < center) ? 'left center' : 'right center';
        });
      }
      build();   // cover the screen immediately, seamlessly
      function open(done) {
        el.style.display = 'flex';
        slats.forEach(function (s, i) {
          s.style.transition = 'transform ' + DUR + 'ms ' + EASE + ' ' +
            Math.round(Math.abs(i - center) * STAGGER) + 'ms';   // centre leads
        });
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          slats.forEach(function (s) { s.style.transform = 'scaleX(0)'; });
          setTimeout(function () { el.style.display = 'none'; if (done) done(); },
            DUR + Math.ceil(N / 2) * STAGGER + 80);
        }); });
      }
      function close(done) {
        build();
        el.style.display = 'flex';
        el.style.zIndex = '10050';   // ride above the lemon burst
        slats.forEach(function (s, i) {
          s.style.transform = 'scaleX(0)';
          s.style.transition = 'transform ' + DUR + 'ms ' + EASE + ' ' +
            Math.round((center - Math.abs(i - center)) * STAGGER) + 'ms'; // edges lead, centre seals last
        });
        requestAnimationFrame(function () { requestAnimationFrame(function () {
          slats.forEach(function (s) { s.style.transform = 'scaleX(1)'; });
          setTimeout(function () { if (done) done(); },
            DUR + Math.ceil(N / 2) * STAGGER + 40);
        }); });
      }
      return { open: open, close: close };
    })();

    // Intro: part the curtain shortly after load.
    setTimeout(function () { window.jlCurtain.open(); }, 200);
  </script>

  <main class="gate" role="main">
    <div class="gate-lemon" aria-hidden="true">
      <img src="assets/lemon.png" alt="" data-comment-anchor="57f0ed4e25-img" />
    </div>

    <span class="gate-private">private</span>

    <h1 class="gate-names">
      <span>LISA</span>
      <span class="gate-amp">&amp;</span>
      <span>JULIAN</span>
    </h1>
    <form class="gate-form" id="gateForm" autocomplete="off">
      <div class="gate-input-row" id="inputRow">
        <input
          class="gate-input"
          id="gatePassword"
          type="password"
          placeholder="password · Passwort"
          aria-label="Password"
          required
          autofocus
        />
        <button type="submit" class="gate-submit">
          Enter →
        </button>
      </div>
      <div class="gate-msg" id="gateMsg" role="status" aria-live="polite"></div>
    </form>

    <div class="gate-hint">
      <button type="button" class="gate-hint-btn" id="hintBtn" data-comment-anchor="795e91020e-button">
        Passwort vergessen / Don't know the password?
      </button>
      <div class="gate-hint-text" id="hintText">
        Schreibt uns kurz an <a href="mailto:hallo@lisa-und-julian.de">hallo@lisa-und-julian.de</a>
        — wir helfen sofort weiter 🍋
      </div>
    </div>
  </main>

  <script>
    // "lemon"   → English site
    // "zitrone" → German site
    const PASSWORDS = {
      'lemon':   'index-en.html',
      'zitrone': 'index-de.html',
    };

    const form  = document.getElementById('gateForm');
    const input = document.getElementById('gatePassword');
    const row   = document.getElementById('inputRow');
    const msg   = document.getElementById('gateMsg');

    // Already unlocked? Send straight to the stored destination.
    const saved = sessionStorage.getItem('jl-gate-redirect');
    if (saved) location.replace(saved);

    function triggerBurst(dest) {
      // Fade the gate out
      document.querySelector('.gate').style.cssText = 'opacity:0; transition:opacity 180ms;';

      // Full-screen yellow flash (behind everything)
      const flash = document.createElement('div');
      flash.className = 'burst-flash';
      document.body.appendChild(flash);

      // Stage holds lemon clone + all confetti
      const stage = document.createElement('div');
      stage.className = 'burst-stage';

      // Lemon clone that swells and pops
      const clone = document.createElement('div');
      clone.className = 'burst-lemon-clone';
      const img = document.createElement('img');
      img.src = 'assets/lemon.png';
      clone.appendChild(img);
      stage.appendChild(clone);
      document.body.appendChild(stage);

      // "La Dolce Vita" text — appears after burst
      const ldv = document.createElement('div');
      ldv.className = 'burst-text';
      ldv.textContent = 'La Dolce Vita';
      document.body.appendChild(ldv);

      // At pop point: shower of confetti
      setTimeout(() => {
        // Design-palette colours: cobalt, lemon shades, cream, sky blue
        const COLORS = [
          '#1E47B5', '#1E47B5',          // cobalt (weighted)
          '#F8D34A', '#F8D34A', '#FCE789', // lemons (weighted)
          '#DCE9F8',                       // pastel sky
          '#FFFBF2',                       // cream
          '#F2B81E',                       // deep lemon
          '#0E2A6B',                       // ink
        ];

        const count = 60;
        for (let i = 0; i < count; i++) {
          const c = document.createElement('div');
          c.className = 'burst-confetti';

          const angle  = Math.random() * Math.PI * 2;
          const dist   = 60 + Math.random() * Math.min(window.innerWidth, window.innerHeight) * 0.6;
          const tx     = Math.cos(angle) * dist;
          const ty     = Math.sin(angle) * dist;
          const spin   = (Math.random() - 0.5) * 900;  // tumble up to 2.5 full rotations
          const color  = COLORS[Math.floor(Math.random() * COLORS.length)];

          // Mix of rectangles (confetti strips) and small circles (dots)
          const isStrip = Math.random() > 0.35;
          const w = isStrip ? (4 + Math.random() * 7)  : (5 + Math.random() * 10);
          const h = isStrip ? (10 + Math.random() * 18) : w;
          const radius = isStrip ? '2px' : '50%';

          c.style.cssText = [
            `width:${w}px`, `height:${h}px`,
            `background:${color}`,
            `border-radius:${radius}`,
            `--tx:${Math.round(tx)}px`,
            `--ty:${Math.round(ty)}px`,
            `--spin:${Math.round(spin)}deg`,
            `--delay:${Math.round(Math.random() * 80)}ms`,
            `--dur:${700 + Math.round(Math.random() * 700)}ms`,
          ].join(';');
          stage.appendChild(c);
        }
      }, 300);

      // Sweep the striped curtain shut over the celebration, then hand off to
      // the next page (which opens the same curtain) — no dead air between.
      setTimeout(() => {
        window.jlCurtain.close(() => { location.href = dest; });
      }, 650);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const v    = (input.value || '').trim().toLowerCase();
      const dest = PASSWORDS[v];
      if (dest) {
        msg.textContent = v === 'zitrone'
          ? 'Willkommen — wir leiten Dich weiter ✨'
          : 'Welcome — taking you there ✨';
        msg.classList.remove('is-error');
        sessionStorage.setItem('jl-gate-redirect', dest);
        triggerBurst(dest);
      } else {
        msg.textContent = 'Not quite — try again. · Nicht ganz — versuch es nochmal.';
        msg.classList.add('is-error');
        row.classList.remove('is-wrong');
        void row.offsetWidth;
        row.classList.add('is-wrong');
        input.select();
      }
    });

    document.getElementById('hintBtn').addEventListener('click', () => {
      document.getElementById('hintText').classList.toggle('is-open');
    });

    input.addEventListener('input', () => {
      if (msg.classList.contains('is-error')) {
        msg.textContent = '';
        msg.classList.remove('is-error');
        row.classList.remove('is-wrong');
      }
    });
  </script>
</body>
</html>
