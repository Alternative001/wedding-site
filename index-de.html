<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lisa &amp; Julian · Lago di Garda · 24.07.2027</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-monogram.svg" />
  <link rel="stylesheet" href="site.css?v=4" />

  <meta name="ext-resource-dependency" content="assets/logo-monogram.svg" data-resource-id="monogramSvg" />

  <!-- Standalone splash / no-JS fallback -->
  <template id="__bundler_thumbnail" data-bg-color="#FFFBF2">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <!-- pastel yellow vertical stripes -->
      <defs>
        <pattern id="stripe" patternUnits="userSpaceOnUse" width="44" height="44" x="0" y="0">
          <rect width="22" height="44" fill="#FFF4C9" />
          <rect x="22" width="22" height="44" fill="#FFFBF2" />
        </pattern>
      </defs>
      <rect width="1200" height="800" fill="url(#stripe)" />
      <!-- soft radial center wash -->
      <radialGradient id="wash" cx="50%" cy="50%" r="55%">
        <stop offset="0%" stop-color="#FFFBF2" stop-opacity="0.92" />
        <stop offset="100%" stop-color="#FFFBF2" stop-opacity="0" />
      </radialGradient>
      <rect width="1200" height="800" fill="url(#wash)" />

      <!-- big serif L &amp; J -->
      <g transform="translate(600, 380)" text-anchor="middle" font-family="Cormorant Garamond, Garamond, serif" fill="#0E2A6B" font-weight="500">
        <text font-size="220" letter-spacing="20">LISA</text>
        <text y="160" font-family="cursive" font-size="180" fill="#1E47B5">&amp;</text>
        <text y="320" font-size="220" letter-spacing="20">JULIAN</text>
      </g>
      <!-- date strip -->
      <g transform="translate(600, 740)" text-anchor="middle" font-family="DM Sans, sans-serif" fill="#1E47B5">
        <text font-size="28" letter-spacing="8">24 · 07 · 2027  ·  LAGO DI GARDA</text>
      </g>
    </svg>
  </template>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Lucide icons (CDN substitution — flagged in README) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- image-slot custom element -->
  <script src="image-slot.js"></script>

  <!-- animations: scroll reveals, parallax, cursor trail, confetti -->
  <script src="animations.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Components (load order matters: leaves first, App last) -->
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Story.jsx"></script>
  <script type="text/babel" src="Schedule.jsx"></script>
  <script type="text/babel" src="Venue.jsx"></script>
  <script type="text/babel" src="FAQ.jsx"></script>
  <script type="text/babel" src="RSVP.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>

  <script>
    // initial icon paint (App also re-paints on every render)
    window.addEventListener('load', () => {
      if (window.lucide && window.lucide.createIcons) {
        setTimeout(() => window.lucide.createIcons(), 100);
      }
    });
  </script>
</body>
</html>
