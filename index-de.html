  <!-- Curtain entry animation: signature stripe slats part from the centre -->
  <style>
    #jl-curtain {
      position: fixed; inset: 0; z-index: 9000;
      display: flex;
      pointer-events: none;
      overflow: hidden;
      background: #FFFBF2;
    }
    .jl-curtain-slat {
      flex: 1; height: 100%;
      /* same signature yellow stripe as the page background */
      background-image: repeating-linear-gradient(90deg,
        #FFF4C9 0 22px, #FFFBF2 22px 44px);
      will-change: transform;
    }
  </style>
</head>
<body>
  <div id="jl-curtain"></div>
  <script>
    (function () {
      var STRIPE = 22, DUR = 520, SPAN = 460, EASE = 'cubic-bezier(0.7,0,0.3,1)';
      var el = document.getElementById('jl-curtain');
      if (!el) return;
      // One slat per signature stripe, so every stripe moves on its own.
      var N = Math.max(8, Math.ceil(window.innerWidth / STRIPE));
      var center = (N - 1) / 2;
      var STAGGER = SPAN / Math.ceil(N / 2);   // keep the total sweep ~constant despite many slats
      var slats = [];
      for (var i = 0; i < N; i++) {
        var s = document.createElement('div');
        s.className = 'jl-curtain-slat';
        s.style.flex = '0 0 ' + STRIPE + 'px';
        s.style.background = (i % 2 === 0) ? '#FFF4C9' : '#FFFBF2';   // alternating stripe colours
        s.style.transformOrigin = (i < center) ? 'left center' : 'right center';
        el.appendChild(s);
        slats.push(s);
      }
      function open() {
        el.style.background = 'transparent';                     // gaps reveal the live page, not the cream cover
        slats.forEach(function (s, i) {
          s.style.transition = 'transform ' + DUR + 'ms ' + EASE + ' ' +
            Math.round(Math.abs(i - center) * STAGGER) + 'ms';   // centre leads
        });
        void el.offsetWidth;                                     // register covered start state (no rAF dependency)
        slats.forEach(function (s) { s.style.transform = 'scaleX(0)'; });
        setTimeout(function () { el.remove(); }, DUR + Math.ceil(N / 2) * STAGGER + 120);
      }
      function reveal() {
        // Snap the above-the-fold content to visible BEHIND the cover, so the
        // curtain parts straight onto the finished page — no blank flash, no
        // fade-in afterwards. Below-the-fold elements still reveal on scroll.
        var vh = window.innerHeight || 800;
        document.querySelectorAll('.jl-reveal').forEach(function (node) {
          var r = node.getBoundingClientRect();
          if (r.top < vh && r.bottom > 0) {
            node.style.transition = 'none';
            node.classList.add('is-visible');
          }
        });
        void document.body.offsetWidth;                          // commit the painted state before parting
        open();
      }
      // Continue the gate's closing curtain: open as soon as React has mounted
      // AND fonts are ready (so text doesn't reflow after the reveal).
      // NB: this script runs before #root is parsed, so re-query it each poll.
      var attempts = 0;
      (function waitForReact() {
        var root = document.getElementById('root');
        if (root && root.children.length > 0) {
          if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { setTimeout(reveal, 40); }); }
          else { setTimeout(reveal, 40); }
        }
        else if (++attempts < 150) { setTimeout(waitForReact, 60); }
        else { reveal(); }
      })();
    })();
  </script>

  <div id="root"></div>
